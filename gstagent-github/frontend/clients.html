<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GSTAgent — Client CRM</title>
  <style>
    body{font-family:Inter,Arial,sans-serif;background:#0f172a;color:#e5e7eb;margin:0;padding:28px}.wrap{max-width:1180px;margin:auto}.card{background:#111827;border:1px solid #334155;border-radius:20px;padding:22px;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}input,select,textarea,button{padding:12px;border-radius:10px;border:1px solid #475569;background:#020617;color:#e5e7eb}textarea{min-height:70px}.full{grid-column:1/-1}button{background:#4f46e5;border:none;cursor:pointer;font-weight:800}.secondary{background:#1f2937}.danger{background:#7f1d1d}.stat{background:#020617;border:1px solid #334155;border-radius:16px;padding:16px}.stat b{font-size:28px}.list{display:grid;gap:12px}.client{display:grid;grid-template-columns:1.5fr 1fr 1fr 1fr auto;gap:12px;align-items:center;background:#020617;border:1px solid #334155;border-radius:14px;padding:14px}.muted{color:#94a3b8}.result{white-space:pre-wrap;background:#020617;border:1px solid #334155;border-radius:14px;padding:14px;overflow:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}a{color:#93c5fd;text-decoration:none}@media(max-width:850px){.grid,.form,.client{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <div><h1>Client Management CRM</h1><p class="muted">Manage CA firm clients, GSTIN/PAN, services, billing and notices.</p></div>
      <div><a href="/app">Dashboard</a> · <a href="/tax">Income Tax</a></div>
    </div>

    <div class="grid" id="stats">
      <div class="stat"><span class="muted">Total Clients</span><br><b id="total">0</b></div>
      <div class="stat"><span class="muted">GST Clients</span><br><b id="gst">0</b></div>
      <div class="stat"><span class="muted">ITR Clients</span><br><b id="itr">0</b></div>
      <div class="stat"><span class="muted">Open Notices</span><br><b id="notices">0</b></div>
    </div>

    <div class="card">
      <h2>Add / Update Client</h2>
      <div class="form">
        <input id="clientId" type="hidden" />
        <input id="client_name" placeholder="Client name" />
        <input id="trade_name" placeholder="Trade name" />
        <input id="pan" placeholder="PAN" maxlength="10" />
        <input id="gstin" placeholder="GSTIN" maxlength="15" />
        <input id="mobile" placeholder="Mobile" />
        <input id="email" placeholder="Email" />
        <input id="city" placeholder="City" />
        <input id="state" placeholder="State" />
        <select id="business_type"><option value="proprietorship">Proprietorship</option><option value="partnership">Partnership</option><option value="llp">LLP</option><option value="private_limited">Private Limited</option><option value="individual">Individual</option></select>
        <input id="assigned_staff" placeholder="Assigned staff" />
        <input id="monthly_gst_fee" type="number" placeholder="Monthly GST fee" />
        <input id="itr_fee" type="number" placeholder="ITR fee" />
        <textarea id="address" class="full" placeholder="Address"></textarea>
        <textarea id="notes" class="full" placeholder="Notes"></textarea>
        <button onclick="saveClient()">Save Client</button>
        <button class="secondary" onclick="resetForm()">Clear</button>
      </div>
    </div>

    <div class="card">
      <div class="top"><h2>Clients</h2><button class="secondary" onclick="loadAll()">Refresh</button></div>
      <div class="form"><input id="search" placeholder="Search name / GSTIN / PAN" oninput="loadClients()"><select id="status" onchange="loadClients()"><option value="all">All</option><option value="active">Active</option><option value="inactive">Inactive</option></select></div>
      <div class="list" id="clientList"></div>
    </div>

    <div class="card"><h2>Result</h2><div class="result" id="result">Ready.</div></div>
  </div>
<script>
const API_BASE='https://gstagent-production.up.railway.app';
function token(){return localStorage.getItem('gstagent_token')||localStorage.getItem('token')||localStorage.getItem('access_token')||''}
async function api(path, options={}){const res=await fetch(API_BASE+path,{...options,headers:{'Content-Type':'application/json','Authorization':'Bearer '+token(),...(options.headers||{})}});const data=await res.json().catch(()=>({error:'Non JSON response'}));if(!res.ok)throw new Error(JSON.stringify(data));return data}
function val(id){return document.getElementById(id).value.trim()}
function num(id){return Number(document.getElementById(id).value||0)}
function show(x){document.getElementById('result').textContent=typeof x==='string'?x:JSON.stringify(x,null,2)}
function resetForm(){['clientId','client_name','trade_name','pan','gstin','mobile','email','city','state','assigned_staff','monthly_gst_fee','itr_fee','address','notes'].forEach(id=>document.getElementById(id).value='')}
async function loadDashboard(){try{const d=await api('/crm/dashboard');document.getElementById('total').textContent=d.total_clients;document.getElementById('gst').textContent=d.gst_clients;document.getElementById('itr').textContent=d.itr_clients;document.getElementById('notices').textContent=d.open_notices}catch(e){show(e.message)}}
async function loadClients(){try{const q=encodeURIComponent(val('search'));const status=val('status');const d=await api(`/crm/clients?q=${q}&status=${status}`);const el=document.getElementById('clientList');el.innerHTML='';if(!d.clients.length){el.innerHTML='<p class="muted">No clients yet.</p>';return}d.clients.forEach(c=>{const div=document.createElement('div');div.className='client';div.innerHTML=`<div><b>${c.client_name}</b><br><span class="muted">${c.trade_name||''}</span></div><div>PAN: ${c.pan||'-'}<br>GSTIN: ${c.gstin||'-'}</div><div>${c.mobile||'-'}<br>${c.email||'-'}</div><div>GST ₹${c.monthly_gst_fee||0}<br>ITR ₹${c.itr_fee||0}</div><div><button class="secondary" onclick='editClient(${JSON.stringify(c).replaceAll("'","&#39;")})'>Edit</button><button class="danger" onclick='deleteClient("${c.id}")'>Inactive</button></div>`;el.appendChild(div)})}catch(e){show(e.message)}}
function editClient(c){document.getElementById('clientId').value=c.id;['client_name','trade_name','pan','gstin','mobile','email','city','state','business_type','assigned_staff','monthly_gst_fee','itr_fee','address','notes'].forEach(id=>{document.getElementById(id).value=c[id]||''});window.scrollTo({top:0,behavior:'smooth'})}
async function saveClient(){try{const payload={client_name:val('client_name'),trade_name:val('trade_name'),pan:val('pan'),gstin:val('gstin'),mobile:val('mobile'),email:val('email'),address:val('address'),city:val('city'),state:val('state'),business_type:val('business_type'),assigned_staff:val('assigned_staff'),monthly_gst_fee:num('monthly_gst_fee'),itr_fee:num('itr_fee'),notes:val('notes')};if(!payload.client_name)throw new Error('Client name required');const id=val('clientId');const d=await api(id?`/crm/clients/${id}`:'/crm/clients',{method:id?'PUT':'POST',body:JSON.stringify(payload)});show(d);resetForm();loadAll()}catch(e){show(e.message)}}
async function deleteClient(id){if(!confirm('Mark this client inactive?'))return;try{show(await api(`/crm/clients/${id}`,{method:'DELETE'}));loadAll()}catch(e){show(e.message)}}
function loadAll(){loadDashboard();loadClients()}
loadAll();
</script>
</body>
</html>
