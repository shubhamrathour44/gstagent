<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Forgot Password — TaxSphere</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:#07090F;color:#E2E8F0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:#0D1117;border:1px solid rgba(255,255,255,.07);border-radius:16px;padding:36px;width:100%;max-width:420px}
.logo{display:flex;align-items:center;gap:9px;font-family:'Instrument Serif',serif;font-size:20px;margin-bottom:28px}
.lm{width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,#6366F1,#8B5CF6);display:flex;align-items:center;justify-content:center;font-size:14px}
h2{font-family:'Instrument Serif',serif;font-size:24px;margin-bottom:6px}
.sub{color:#475569;font-size:13px;margin-bottom:24px}
label{display:block;font-size:11px;font-weight:700;color:#475569;text-transform:uppercase;letter-spacing:.07em;margin-bottom:5px}
input{width:100%;background:rgba(255,255,255,.04);border:1.5px solid rgba(255,255,255,.1);border-radius:9px;padding:11px 13px;color:#E2E8F0;font-size:14px;font-family:'DM Sans',sans-serif;outline:none;transition:border-color .15s;margin-bottom:16px}
input:focus{border-color:#6366F1}
.otp-input{letter-spacing:8px;font-size:22px;text-align:center;font-weight:700}
.btn{width:100%;padding:12px;background:#6366F1;color:#fff;border:none;border-radius:9px;font-size:14px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .15s;margin-bottom:12px}
.btn:hover{background:#5254CC}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-ghost{background:transparent;color:#94A3B8;border:1px solid rgba(255,255,255,.1)}
.btn-ghost:hover{background:rgba(255,255,255,.04);color:#E2E8F0}
.msg{padding:12px;border-radius:8px;font-size:13px;margin-bottom:16px;display:none}
.msg.success{background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.2);color:#86EFAC}
.msg.error{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.2);color:#FCA5A5}
.msg.info{background:rgba(99,102,241,.1);border:1px solid rgba(99,102,241,.2);color:#A5B4FC}
.step{display:none}
.step.active{display:block}
.back{color:#6366F1;font-size:13px;cursor:pointer;text-decoration:none;display:block;text-align:center;margin-top:8px}
.timer{font-size:12px;color:#475569;text-align:center;margin-bottom:12px}
</style>
</head>
<body>
<div class="card">
  <div class="logo"><div class="lm">⚡</div>TaxSphere</div>

  <!-- Step 1: Enter Email -->
  <div class="step active" id="step1">
    <h2>Forgot Password</h2>
    <p class="sub">Enter your email to receive a reset OTP</p>
    <div id="msg1" class="msg"></div>
    <label>Email Address</label>
    <input type="email" id="email" placeholder="you@example.com"/>
    <button class="btn" id="send-btn" onclick="sendOTP()">Send OTP</button>
    <a href="/login" class="back">← Back to Login</a>
  </div>

  <!-- Step 2: Enter OTP -->
  <div class="step" id="step2">
    <h2>Enter OTP</h2>
    <p class="sub" id="otp-sub">OTP sent to your email</p>
    <div id="msg2" class="msg"></div>
    <label>6-Digit OTP</label>
    <input type="text" id="otp" class="otp-input" placeholder="······" maxlength="6"/>
    <div class="timer" id="timer">OTP expires in <span id="countdown">10:00</span></div>
    <button class="btn" id="verify-btn" onclick="verifyOTP()">Verify OTP</button>
    <button class="btn btn-ghost" onclick="resendOTP()">Resend OTP</button>
    <a href="#" class="back" onclick="goBack(1)">← Change Email</a>
  </div>

  <!-- Step 3: New Password -->
  <div class="step" id="step3">
    <h2>New Password</h2>
    <p class="sub">Choose a strong password</p>
    <div id="msg3" class="msg"></div>
    <label>New Password</label>
    <input type="password" id="new-password" placeholder="Minimum 6 characters"/>
    <label>Confirm Password</label>
    <input type="password" id="confirm-password" placeholder="Repeat password"/>
    <button class="btn" id="reset-btn" onclick="resetPassword()">Reset Password</button>
  </div>

  <!-- Step 4: Success -->
  <div class="step" id="step4">
    <div style="text-align:center;padding:20px 0">
      <div style="font-size:48px;margin-bottom:16px">✅</div>
      <h2 style="margin-bottom:8px">Password Reset!</h2>
      <p style="color:#475569;font-size:13px;margin-bottom:24px">Your password has been changed successfully.</p>
      <a href="/login"><button class="btn">Go to Login</button></a>
    </div>
  </div>

</div>

<script>
const API = "https://TaxSphere-production.up.railway.app";
let countdownInterval;

function showMsg(step, type, text) {
  const el = document.getElementById(`msg${step}`);
  el.className = `msg ${type}`;
  el.textContent = text;
  el.style.display = 'block';
}

function goBack(step) {
  document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
  document.getElementById(`step${step}`).classList.add('active');
  clearInterval(countdownInterval);
}

function startCountdown() {
  let seconds = 600;
  clearInterval(countdownInterval);
  countdownInterval = setInterval(() => {
    seconds--;
    const m = Math.floor(seconds / 60);
    const s = seconds % 60;
    document.getElementById('countdown').textContent = `${m}:${s.toString().padStart(2,'0')}`;
    if (seconds <= 0) {
      clearInterval(countdownInterval);
      document.getElementById('countdown').textContent = 'Expired';
    }
  }, 1000);
}

async function sendOTP() {
  const email = document.getElementById('email').value.trim();
  if (!email) { showMsg(1, 'error', 'Please enter your email'); return; }

  const btn = document.getElementById('send-btn');
  btn.disabled = true;
  btn.textContent = 'Sending...';

  try {
    const res = await fetch(API + '/auth/forgot-password', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({email})
    });
    const data = await res.json();

    if (data.otp) {
      // SMTP not configured — show OTP directly
      showMsg(1, 'info', `OTP (testing mode): ${data.otp}`);
      setTimeout(() => {
        document.getElementById('otp-sub').textContent = `OTP shown above (email not configured)`;
        document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
        document.getElementById('step2').classList.add('active');
        startCountdown();
      }, 2000);
    } else {
      document.getElementById('otp-sub').textContent = `OTP sent to ${email}`;
      document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
      document.getElementById('step2').classList.add('active');
      startCountdown();
    }
  } catch(e) {
    showMsg(1, 'error', 'Something went wrong. Try again.');
  }
  btn.disabled = false;
  btn.textContent = 'Send OTP';
}

async function verifyOTP() {
  const email = document.getElementById('email').value.trim();
  const otp = document.getElementById('otp').value.trim();
  if (otp.length !== 6) { showMsg(2, 'error', 'Enter 6-digit OTP'); return; }

  const btn = document.getElementById('verify-btn');
  btn.disabled = true;
  btn.textContent = 'Verifying...';

  try {
    const res = await fetch(API + '/auth/verify-otp', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({email, otp})
    });
    const data = await res.json();
    if (res.ok) {
      clearInterval(countdownInterval);
      document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
      document.getElementById('step3').classList.add('active');
    } else {
      showMsg(2, 'error', data.detail || 'Invalid OTP');
    }
  } catch(e) {
    showMsg(2, 'error', 'Something went wrong.');
  }
  btn.disabled = false;
  btn.textContent = 'Verify OTP';
}

async function resetPassword() {
  const email = document.getElementById('email').value.trim();
  const otp = document.getElementById('otp').value.trim();
  const newPass = document.getElementById('new-password').value;
  const confirmPass = document.getElementById('confirm-password').value;

  if (newPass.length < 6) { showMsg(3, 'error', 'Password must be at least 6 characters'); return; }
  if (newPass !== confirmPass) { showMsg(3, 'error', 'Passwords do not match'); return; }

  const btn = document.getElementById('reset-btn');
  btn.disabled = true;
  btn.textContent = 'Resetting...';

  try {
    const res = await fetch(API + '/auth/reset-password', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({email, otp, new_password: newPass})
    });
    const data = await res.json();
    if (res.ok) {
      document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
      document.getElementById('step4').classList.add('active');
    } else {
      showMsg(3, 'error', data.detail || 'Reset failed');
    }
  } catch(e) {
    showMsg(3, 'error', 'Something went wrong.');
  }
  btn.disabled = false;
  btn.textContent = 'Reset Password';
}

async function resendOTP() {
  clearInterval(countdownInterval);
  await sendOTP();
}
</script>
</body>
</html>
