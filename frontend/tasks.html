<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Task & Staff Management - TaxSphere</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100">
<div class="min-h-screen p-6">
<div class="max-w-7xl mx-auto">

<div class="flex justify-between items-center mb-6">
<h1 class="text-3xl font-bold text-gray-800">Task & Staff Management</h1>
<div class="flex gap-4">
<a href="/clients" class="text-green-600 font-semibold">CRM</a>
<a href="/notices" class="text-red-600 font-semibold">Notices</a>
<a href="/compliance" class="text-orange-600 font-semibold">Compliance</a>
<a href="/app" class="text-blue-600 font-semibold">Dashboard</a>
</div>
</div>

<div class="grid grid-cols-1 md:grid-cols-7 gap-4 mb-6">
<div class="bg-white p-5 rounded-xl shadow"><p>Total</p><h2 id="total_tasks" class="text-3xl font-bold">0</h2></div>
<div class="bg-white p-5 rounded-xl shadow"><p>Pending</p><h2 id="pending_tasks" class="text-3xl font-bold text-yellow-600">0</h2></div>
<div class="bg-white p-5 rounded-xl shadow"><p>In Progress</p><h2 id="in_progress_tasks" class="text-3xl font-bold text-blue-600">0</h2></div>
<div class="bg-white p-5 rounded-xl shadow"><p>Review</p><h2 id="review_tasks" class="text-3xl font-bold text-purple-600">0</h2></div>
<div class="bg-white p-5 rounded-xl shadow"><p>Completed</p><h2 id="completed_tasks" class="text-3xl font-bold text-green-600">0</h2></div>
<div class="bg-white p-5 rounded-xl shadow"><p>High Priority</p><h2 id="high_priority_tasks" class="text-3xl font-bold text-red-600">0</h2></div>
<div class="bg-white p-5 rounded-xl shadow"><p>Overdue</p><h2 id="overdue_tasks" class="text-3xl font-bold text-red-700">0</h2></div>
</div>

<div class="bg-white p-6 rounded-xl shadow mb-6">
<h2 class="text-xl font-bold mb-4">Create Task</h2>

<form id="taskForm" class="grid grid-cols-1 md:grid-cols-3 gap-4">

<select id="clientSelect" class="border p-3 rounded">
<option value="">Select CRM Client</option>
</select>

<input id="client_id" name="client_id" class="border p-3 rounded" placeholder="Client ID" readonly>
<input id="client_name" name="client_name" class="border p-3 rounded" placeholder="Client Name">

<input id="title" name="title" class="border p-3 rounded md:col-span-2" placeholder="Task Title" required>

<select id="task_type" name="task_type" class="border p-3 rounded">
<option value="general">General</option>
<option value="gst_return">GST Return</option>
<option value="itr_filing">ITR Filing</option>
<option value="tds_return">TDS Return</option>
<option value="notice_reply">Notice Reply</option>
<option value="document_collection">Document Collection</option>
<option value="billing_followup">Billing Follow-up</option>
<option value="audit">Audit</option>
</select>

<select id="priority" name="priority" class="border p-3 rounded">
<option value="low">Low</option>
<option value="medium" selected>Medium</option>
<option value="high">High</option>
</select>

<select id="status" name="status" class="border p-3 rounded">
<option value="pending">Pending</option>
<option value="in_progress">In Progress</option>
<option value="review">Review</option>
<option value="completed">Completed</option>
</select>

<input id="due_date" name="due_date" type="datetime-local" class="border p-3 rounded">

<input id="assigned_staff" name="assigned_staff" class="border p-3 rounded" placeholder="Assigned Staff">
<input id="assigned_staff_email" name="assigned_staff_email" class="border p-3 rounded" placeholder="Staff Email">

<input id="linked_notice_id" name="linked_notice_id" class="border p-3 rounded" placeholder="Linked Notice ID">
<input id="linked_compliance_id" name="linked_compliance_id" class="border p-3 rounded" placeholder="Linked Compliance ID">
<input id="linked_document_id" name="linked_document_id" class="border p-3 rounded" placeholder="Linked Document ID">

<textarea id="description" name="description" class="border p-3 rounded md:col-span-2" placeholder="Task Description"></textarea>
<textarea id="remarks" name="remarks" class="border p-3 rounded" placeholder="Remarks"></textarea>

<button type="submit" class="bg-blue-600 text-white p-3 rounded font-semibold hover:bg-blue-700">
Save Task
</button>

</form>
</div>

<div class="bg-white p-6 rounded-xl shadow mb-6">
<div class="flex flex-col md:flex-row justify-between gap-3 mb-4">
<h2 class="text-xl font-bold">Search Tasks</h2>
<button onclick="refreshAll()" class="bg-gray-800 text-white px-4 py-2 rounded font-semibold">Refresh</button>
</div>

<div class="grid grid-cols-1 md:grid-cols-4 gap-3">
<input id="searchInput" class="border p-3 rounded md:col-span-3" placeholder="Search title, client, status, staff, priority">
<button onclick="searchTasks()" class="bg-indigo-600 text-white px-4 py-2 rounded font-semibold">Search</button>
</div>
</div>

<div class="bg-white p-6 rounded-xl shadow">
<h2 class="text-xl font-bold mb-4">Task List</h2>

<div class="overflow-x-auto">
<table class="w-full border-collapse">
<thead>
<tr class="bg-gray-200 text-left">
<th class="p-3">Client</th>
<th class="p-3">Task</th>
<th class="p-3">Type</th>
<th class="p-3">Priority</th>
<th class="p-3">Status</th>
<th class="p-3">Staff</th>
<th class="p-3">Due Date</th>
<th class="p-3">Actions</th>
</tr>
</thead>
<tbody id="taskRows">
<tr><td colspan="8" class="p-4 text-center text-gray-500">No tasks yet</td></tr>
</tbody>
</table>
</div>
</div>

</div>
</div>

<script>
const API_BASE = "https://TaxSphere-production.up.railway.app";

function getToken(){
return localStorage.getItem("TaxSphere_token") || localStorage.getItem("access_token") || localStorage.getItem("token") || "";
}

function headers(){
return {
"Content-Type":"application/json",
"Authorization":"Bearer " + getToken()
};
}

function badge(text, kind){
let color = "bg-gray-200 text-gray-700";
if(kind === "high") color = "bg-red-100 text-red-700";
if(kind === "medium") color = "bg-yellow-100 text-yellow-700";
if(kind === "low") color = "bg-green-100 text-green-700";
if(kind === "pending") color = "bg-yellow-100 text-yellow-700";
if(kind === "in_progress") color = "bg-blue-100 text-blue-700";
if(kind === "review") color = "bg-purple-100 text-purple-700";
if(kind === "completed") color = "bg-green-100 text-green-700";
return `<span class="px-3 py-1 rounded-full text-xs font-semibold ${color}">${text || "-"}</span>`;
}

async function loadCRMClients(){
try{
const res = await fetch(`${API_BASE}/crm/clients`, {headers: headers()});
if(!res.ok) return;

const data = await res.json();
const clients = data.clients || [];
const select = document.getElementById("clientSelect");

select.innerHTML = `<option value="">Select CRM Client</option>`;

clients.forEach(c=>{
const opt = document.createElement("option");
opt.value = JSON.stringify({
id: c.id || "",
client_name: c.client_name || ""
});
opt.textContent = c.client_name || "Unnamed Client";
select.appendChild(opt);
});
}catch(e){
console.error("CRM clients load failed", e);
}
}

document.getElementById("clientSelect").addEventListener("change", function(){
if(!this.value) return;
const c = JSON.parse(this.value);
document.getElementById("client_id").value = c.id || "";
document.getElementById("client_name").value = c.client_name || "";
});

function renderTasks(tasks){
const rows = document.getElementById("taskRows");

if(!tasks || tasks.length === 0){
rows.innerHTML = `<tr><td colspan="8" class="p-4 text-center text-gray-500">No tasks found</td></tr>`;
return;
}

rows.innerHTML = tasks.map(t=>`
<tr class="border-b hover:bg-gray-50">
<td class="p-3">${t.client_name || "-"}</td>
<td class="p-3">
<div class="font-semibold">${t.title || "-"}</div>
<div class="text-xs text-gray-500">${t.description || ""}</div>
</td>
<td class="p-3">${t.task_type || "-"}</td>
<td class="p-3">${badge(t.priority, t.priority)}</td>
<td class="p-3">${badge(t.status, t.status)}</td>
<td class="p-3">
<div>${t.assigned_staff || "-"}</div>
<div class="text-xs text-gray-500">${t.assigned_staff_email || ""}</div>
</td>
<td class="p-3">${t.due_date ? String(t.due_date).slice(0,10) : "-"}</td>
<td class="p-3">
<div class="flex flex-wrap gap-2">
<button onclick="setStatus('${t.id}','in_progress')" class="bg-blue-600 text-white px-3 py-1 rounded text-sm">Start</button>
<button onclick="setStatus('${t.id}','review')" class="bg-purple-600 text-white px-3 py-1 rounded text-sm">Review</button>
<button onclick="markCompleted('${t.id}')" class="bg-green-600 text-white px-3 py-1 rounded text-sm">Done</button>
<button onclick="deleteTask('${t.id}')" class="bg-red-600 text-white px-3 py-1 rounded text-sm">Delete</button>
</div>
</td>
</tr>
`).join("");
}

async function loadDashboard(){
try{
const res = await fetch(`${API_BASE}/tasks/dashboard`, {headers: headers()});
if(!res.ok) return;

const data = await res.json();

document.getElementById("total_tasks").innerText = data.total_tasks || 0;
document.getElementById("pending_tasks").innerText = data.pending_tasks || 0;
document.getElementById("in_progress_tasks").innerText = data.in_progress_tasks || 0;
document.getElementById("review_tasks").innerText = data.review_tasks || 0;
document.getElementById("completed_tasks").innerText = data.completed_tasks || 0;
document.getElementById("high_priority_tasks").innerText = data.high_priority_tasks || 0;
document.getElementById("overdue_tasks").innerText = data.overdue_tasks || 0;
}catch(e){
console.error("Dashboard load failed", e);
}
}

async function loadTasks(){
try{
const res = await fetch(`${API_BASE}/tasks/list`, {headers: headers()});
if(!res.ok) return;

const data = await res.json();
renderTasks(data.tasks || []);
}catch(e){
console.error("Tasks load failed", e);
}
}

async function searchTasks(){
const q = document.getElementById("searchInput").value.trim();

if(!q){
await loadTasks();
return;
}

const res = await fetch(`${API_BASE}/tasks/search?q=${encodeURIComponent(q)}`, {headers: headers()});
if(!res.ok){
alert("Search failed");
return;
}

const data = await res.json();
renderTasks(data.tasks || []);
}

document.getElementById("taskForm").addEventListener("submit", async function(e){
e.preventDefault();

if(!getToken()){
alert("Please login again");
window.location.href = "/login";
return;
}

const formData = new FormData(e.target);
const payload = Object.fromEntries(formData.entries());

if(payload.due_date){
payload.due_date = new Date(payload.due_date).toISOString();
}else{
payload.due_date = null;
}

for(const key in payload){
if(payload[key] === "") payload[key] = null;
}

const res = await fetch(`${API_BASE}/tasks/create`, {
method: "POST",
headers: headers(),
body: JSON.stringify(payload)
});

if(res.ok){
alert("Task saved successfully");
e.target.reset();
await refreshAll();
}else{
alert("Task failed: " + await res.text());
}
});

async function updateTask(id, payload){
const res = await fetch(`${API_BASE}/tasks/update/${id}`, {
method: "PUT",
headers: headers(),
body: JSON.stringify(payload)
});

if(res.ok){
await refreshAll();
}else{
alert("Update failed: " + await res.text());
}
}

async function setStatus(id, status){
await updateTask(id, {status: status});
}

async function markCompleted(id){
const res = await fetch(`${API_BASE}/tasks/mark-completed/${id}`, {
method: "PUT",
headers: headers()
});

if(res.ok){
await refreshAll();
}else{
alert("Complete failed: " + await res.text());
}
}

async function deleteTask(id){
if(!confirm("Delete this task?")) return;

const res = await fetch(`${API_BASE}/tasks/delete/${id}`, {
method: "DELETE",
headers: headers()
});

if(res.ok){
alert("Task deleted");
await refreshAll();
}else{
alert("Delete failed: " + await res.text());
}
}

async function refreshAll(){
await loadCRMClients();
await loadDashboard();
await loadTasks();
}

document.getElementById("searchInput").addEventListener("keydown", function(e){
if(e.key === "Enter"){
e.preventDefault();
searchTasks();
}
});

refreshAll();
</script>

</body>
</html>
