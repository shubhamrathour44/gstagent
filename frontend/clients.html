```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TaxSphere CRM</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100">

<div class="max-w-7xl mx-auto p-6">

<div class="flex justify-between items-center mb-6">
<h1 class="text-3xl font-bold">Client CRM</h1>
<a href="/app" class="text-blue-600 font-semibold">Dashboard</a>
</div>

<div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">

<div class="bg-white p-5 rounded shadow">
<p>Total Clients</p>
<h2 id="total_clients" class="text-3xl font-bold">0</h2>
</div>

<div class="bg-white p-5 rounded shadow">
<p>Active Clients</p>
<h2 id="active_clients" class="text-3xl font-bold text-green-600">0</h2>
</div>

<div class="bg-white p-5 rounded shadow">
<p>GST Clients</p>
<h2 id="gst_clients" class="text-3xl font-bold text-blue-600">0</h2>
</div>

<div class="bg-white p-5 rounded shadow">
<p>Monthly Revenue</p>
<h2 id="monthly_revenue" class="text-2xl font-bold text-purple-600">₹0</h2>
</div>

</div>

<div class="bg-white p-6 rounded shadow mb-6">

<h2 class="text-xl font-bold mb-4">Add Client</h2>

<form id="clientForm" class="grid grid-cols-1 md:grid-cols-3 gap-4">

<input name="client_name" placeholder="Client Name" class="border p-3 rounded" required>

<input name="trade_name" placeholder="Trade Name" class="border p-3 rounded">

<input name="mobile" placeholder="Mobile" class="border p-3 rounded">

<input name="email" placeholder="Email" class="border p-3 rounded">

<input name="pan" placeholder="PAN" class="border p-3 rounded">

<input name="gstin" placeholder="GSTIN" class="border p-3 rounded">

<input name="monthly_gst_fee" type="number" placeholder="Monthly GST Fee" class="border p-3 rounded">

<input name="itr_fee" type="number" placeholder="ITR Fee" class="border p-3 rounded">

<input name="assigned_staff" placeholder="Assigned Staff" class="border p-3 rounded">

<button class="bg-blue-600 text-white p-3 rounded font-bold">
Save Client
</button>

</form>

</div>

<div class="bg-white p-6 rounded shadow mb-6">

<div class="flex gap-3">

<input
id="search"
placeholder="Search Client"
class="border p-3 rounded flex-1">

<button
onclick="searchClients()"
class="bg-indigo-600 text-white px-5 rounded">
Search
</button>

<button
onclick="loadClients()"
class="bg-gray-800 text-white px-5 rounded">
Refresh
</button>

</div>

</div>

<div class="bg-white p-6 rounded shadow">

<h2 class="text-xl font-bold mb-4">Client List</h2>

<div class="overflow-x-auto">

<table class="w-full">

<thead>
<tr class="bg-gray-200">
<th class="p-3 text-left">Client</th>
<th class="p-3 text-left">PAN</th>
<th class="p-3 text-left">GSTIN</th>
<th class="p-3 text-left">Mobile</th>
<th class="p-3 text-left">GST Fee</th>
</tr>
</thead>

<tbody id="clientRows">
<tr>
<td colspan="5" class="p-4 text-center">
No Clients
</td>
</tr>
</tbody>

</table>

</div>

</div>

</div>

<script>

const API_BASE = "https://gstagent-production.up.railway.app";

function getToken(){
return (
localStorage.getItem("TaxSphere_token") ||
localStorage.getItem("access_token") ||
localStorage.getItem("token") ||
""
);
}

function headers(){
return {
"Content-Type":"application/json",
"Authorization":"Bearer " + getToken()
};
}

function rupee(v){
return "₹" + Number(v || 0).toLocaleString("en-IN");
}

async function loadDashboard(){

const res = await fetch(
API_BASE + "/crm/dashboard",
{headers:headers()}
);

if(!res.ok) return;

const d = await res.json();

document.getElementById("total_clients").innerText =
d.total_clients || 0;

document.getElementById("active_clients").innerText =
d.active_clients || 0;

document.getElementById("gst_clients").innerText =
d.gst_clients || 0;

document.getElementById("monthly_revenue").innerText =
rupee(d.estimated_monthly_revenue);

}

async function loadClients(){

const res = await fetch(
API_BASE + "/crm/clients",
{headers:headers()}
);

if(!res.ok) return;

const data = await res.json();

const rows =
document.getElementById("clientRows");

if(!data.clients || data.clients.length===0){
rows.innerHTML =
'<tr><td colspan="5" class="p-4 text-center">No Clients</td></tr>';
return;
}

rows.innerHTML =
data.clients.map(c=>`
<tr class="border-b">
<td class="p-3">${c.client_name || "-"}</td>
<td class="p-3">${c.pan || "-"}</td>
<td class="p-3">${c.gstin || "-"}</td>
<td class="p-3">${c.mobile || "-"}</td>
<td class="p-3">${rupee(c.monthly_gst_fee)}</td>
</tr>
`).join("");

}

async function searchClients(){

const q =
document.getElementById("search").value;

const res = await fetch(
API_BASE + "/crm/search?q=" + encodeURIComponent(q),
{headers:headers()}
);

if(!res.ok) return;

const data = await res.json();

const rows =
document.getElementById("clientRows");

rows.innerHTML =
data.clients.map(c=>`
<tr class="border-b">
<td class="p-3">${c.client_name || "-"}</td>
<td class="p-3">${c.pan || "-"}</td>
<td class="p-3">${c.gstin || "-"}</td>
<td class="p-3">${c.mobile || "-"}</td>
<td class="p-3">${rupee(c.monthly_gst_fee)}</td>
</tr>
`).join("");

}

document
.getElementById("clientForm")
.addEventListener("submit", async function(e){

e.preventDefault();

const fd = new FormData(e.target);

const payload =
Object.fromEntries(fd.entries());

payload.monthly_gst_fee =
Number(payload.monthly_gst_fee || 0);

payload.itr_fee =
Number(payload.itr_fee || 0);

const res = await fetch(
API_BASE + "/crm/clients",
{
method:"POST",
headers:headers(),
body:JSON.stringify(payload)
}
);

if(res.ok){
alert("Client Created");
e.target.reset();
loadDashboard();
loadClients();
}else{
alert(await res.text());
}

});

loadDashboard();
loadClients();

</script>

</body>
</html>
